<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR記念撮影</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- A-Frame AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiError: no; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; preserveDrawingBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        sprite-anim="src: ./output/hatch-pet/kirika/final/spritesheet.webp; columns: 8; rows: 9; row: 0; frames: 6; fps: 8; planeWidth: 1.2; planeHeight: 1.3"
        kirika-behavior="moveSpeed: 0.3; moveRange: 0.6"
        position="0 0.7 0">
      </a-entity>
      <a-entity
        banner="text: 2026.5.22 渋谷オリエンテーリング|GOALおめでとう！！; bgColor: #fff8e1; textColor: #d84315; borderColor: #ff7043; planeWidth: 1.9; planeHeight: 0.6; canvasWidth: 1200; canvasHeight: 400"
        position="0 1.7 0">
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>カメラを起動しています...</p>
    </div>
  </div>

  <!-- Scan Hint -->
  <div id="scan-hint" style="display: none;">
    <p>マーカーにカメラを向けてください</p>
  </div>

  <!-- Capture Button -->
  <button id="capture-btn" style="display: none;">撮影</button>

  <!-- Photo Preview Modal -->
  <div id="photo-modal" style="display: none;">
    <div class="modal-content">
      <img id="photo-preview" alt="撮影した写真">
      <div class="modal-buttons">
        <a id="download-btn" download="ar-photo.jpg">保存</a>
        <button id="close-modal-btn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/banner.js"></script>
  <script src="js/kirika-behavior.js"></script>
</body>
</html>
